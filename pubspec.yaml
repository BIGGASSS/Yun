name: yun
description: A quiet, private music library with offline playback and listening history.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.18
  audio_service_mpris: ^0.2.0
  audio_session: ^0.2.2
  crypto: ^3.0.6
  dbus: ^0.7.15
  desktop_drop: ^0.8.4
  dio: ^5.9.0
  drift: ^2.30.0
  file_picker: ^10.3.10
  flutter_secure_storage: ^10.0.0
  # Must match the native bridge generated by smtc_windows 1.1.0.
  flutter_rust_bridge: 2.11.1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  smtc_windows: ^1.1.0
  sqlite3: ^3.1.0
  tray_manager: 0.5.3
  uuid: ^4.5.2
  window_manager: 0.5.2

# Linux-only patch: retain libsecret encryption and support KDE's advertised
# org.kde.secretservicecompat endpoint when the standard name is absent.
dependency_overrides:
  flutter_secure_storage_linux:
    path: packages/flutter_secure_storage_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/tray_icons/
