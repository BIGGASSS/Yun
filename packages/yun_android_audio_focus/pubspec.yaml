environment:
  sdk: ^3.13.4
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: app.yun.yun
        pluginClass: AndroidAudioFocusPlugin
