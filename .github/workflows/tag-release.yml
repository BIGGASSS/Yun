name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev liblzma-dev
      - uses: ./.github/actions/flutter
      - run: fvm dart format --output=none --set-exit-if-changed lib test
      - run: fvm flutter analyze
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo test --manifest-path server/Cargo.toml --locked
      - run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo build --manifest-path server/Cargo.toml --release --locked
      - name: Flutter tests against actual server binary
        env:
          YUN_SERVER_BINARY: ${{ github.workspace }}/server/target/release/yun-server
        run: fvm flutter test
      - run: RUN_NATIVE_PLAYBACK=1 fvm flutter test test/services/native_playback_test.dart
      - run: python3 scripts/api_smoke.py --binary server/target/release/yun-server
      - run: for script in scripts/*.sh scripts/release/*.sh; do bash -n "$script"; done
      - run: shellcheck scripts/*.sh scripts/release/*.sh
      - run: python3 scripts/test-release-tooling.py
      - run: python3 scripts/release/test-android-signing.py
      - run: python3 scripts/release/test-workflow-policy.py
  clients:
    needs: validate
    uses: ./.github/workflows/native-builds.yml
    with:
      android_signing: release-signed
    # The called Android job reads only release-signing environment secrets.
  server:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - run: |
          cargo build --manifest-path server/Cargo.toml --release --locked
          mkdir -p dist/server
          cp server/target/release/yun-server server/README.md server/Cargo.lock dist/server/
          cp docs/OPERATIONS.md dist/server/
          cargo metadata --manifest-path server/Cargo.toml --locked --format-version 1 > dist/server/dependencies.json
          tar -czf dist/yun-server-linux-x64.tar.gz -C dist/server .
          rm -rf dist/server
          python scripts/release/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yun-server-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [clients, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: yun-*
          path: artifacts
          # Each artifact has its own SHA256SUMS and inventory files.
          merge-multiple: false
      - name: Verify and collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          assets=(
            yun-linux-x64/yun-linux-x64.tar.gz
            yun-macos-arm64-unsigned/yun-macos-arm64-unsigned.dmg
            yun-windows-x64-unsigned/yun-windows-x64-unsigned.zip
            yun-android-arm64-release-signed/yun-android-arm64-release-signed.apk
            yun-server-linux-x64/yun-server-linux-x64.tar.gz
          )
          for asset in "${assets[@]}"; do
            (cd "artifacts/$(dirname "$asset")" && sha256sum --check SHA256SUMS)
            cp "artifacts/$asset" dist/
          done
          python3 scripts/release/checksums.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes \
            --notes 'Android is release-signed. macOS and Windows builds are unsigned. See docs/RELEASE.md for installation and validation caveats.'
