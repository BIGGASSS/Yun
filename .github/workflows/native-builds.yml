name: Native client artifacts
on:
  workflow_call:
    inputs:
      android_signing:
        description: 'debug-signed evaluation or release-signed APK (manual/tag release)'
        type: string
        default: debug-signed
    # Optional for debug/CI callers; release values come from the job environment.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: macos-arm64-unsigned
            os: macos-15
          - target: windows-x64-unsigned
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev liblzma-dev
      # smtc_windows builds Rust via Cargokit. Do not rely on a preinstalled toolchain.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: ./.github/actions/flutter
      - name: Dependency inventory (not a completed license audit)
        shell: bash
        run: |
          mkdir -p dist
          dart pub global run fvm:main flutter pub deps --style=compact > dist/flutter-dependencies.txt
          cp pubspec.lock dist/pubspec.lock
          cp docs/RELEASE.md docs/VALIDATION.md scripts/release/NOTICES.txt dist/
          printf '%s\n' "Commit: $GITHUB_SHA" "Target: ${{ matrix.target }}" > dist/BUILD.txt
          dart pub global run fvm:main flutter --version >> dist/BUILD.txt
          rustc --version >> dist/BUILD.txt
      - if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          fvm flutter build linux --release --target-platform linux-x64
          python3 scripts/verify-linux-tray-linkage.py --bundle build/linux/x64/release/bundle
          bash scripts/release/package-linux.sh
      - if: matrix.target == 'macos-arm64-unsigned'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          fvm flutter config --enable-macos-arm64-only
          fvm flutter build macos --release
          bash scripts/release/package-macos.sh
      - if: matrix.target == 'windows-x64-unsigned'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'Windows artifacts must be built on an x64 host'
          }
          # Flutter 3.47 derives Windows architecture from the build host.
          fvm flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/release/package-windows.ps1
      - name: Checksums
        shell: bash
        run: python scripts/release/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yun-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  android:
    # Gate before environment approval/secrets, not just inside a build step.
    if: >-
      inputs.android_signing == 'debug-signed' ||
      (inputs.android_signing == 'release-signed' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-24.04
    # Signing secrets belong ONLY to release-signing (never repository/org secrets).
    # Configure required reviewers + restricted branches/tags on that environment.
    # CI evaluation jobs receive no signing credentials.
    environment: ${{ inputs.android_signing == 'release-signed' && 'release-signing' || 'native-evaluation' }}
    steps:
      - name: Validate signing request
        env:
          MODE: ${{ inputs.android_signing }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$MODE" in
            debug-signed) ;;
            release-signed)
              if [[ ! ( "$EVENT" == workflow_dispatch && "$REF" == refs/heads/main ) && ! ( "$EVENT" == push && "$REF" == refs/tags/v* ) ]]; then
                echo 'Release signing requires manual dispatch on main or a v* tag push' >&2
                exit 1
              fi
              ;;
            *) echo 'Unknown Android signing mode' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify signed source is on main
        if: inputs.android_signing == 'release-signed'
        run: |
          set -euo pipefail
          # Public repository: fetch without persisting checkout credentials.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Release signing requires a commit reachable from origin/main' >&2
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Android audio focus JVM contracts
        run: bash android/test-audio-focus.sh
      - name: Android media-service binding JVM contracts
        run: bash packages/audio_service/android/test-connection.sh
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Legacy SDK 'tools' was removed; Flutter installs platform/build tools.
          packages: platform-tools
      - uses: ./.github/actions/flutter
      - name: Dependency inventory (not a completed license audit)
        env:
          MODE: ${{ inputs.android_signing }}
        run: |
          mkdir -p dist
          fvm flutter pub deps --style=compact > dist/flutter-dependencies.txt
          cp pubspec.lock dist/pubspec.lock
          cp docs/RELEASE.md docs/VALIDATION.md scripts/release/NOTICES.txt dist/
          printf '%s\n' "Commit: $GITHUB_SHA" "Target: android-arm64-$MODE" > dist/BUILD.txt
          fvm flutter --version >> dist/BUILD.txt
      - name: Build explicitly debug-signed evaluation APK
        if: inputs.android_signing == 'debug-signed'
        run: bash scripts/release/build-android.sh debug-signed
      - name: Verify optimized release APK media resources without signing
        if: inputs.android_signing == 'debug-signed'
        run: bash scripts/release/build-android.sh release-validation
      - name: Preserve verified unsigned release APK for inspection
        if: inputs.android_signing == 'debug-signed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yun-android-arm64-release-validation-unsigned
          path: build/release-validation/yun-android-arm64-release-validation-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build and verify release-signed APK (no fallback)
        if: inputs.android_signing == 'release-signed'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/release/build-android.sh release-signed
      - name: Resource verifier regressions with installed Android SDK
        run: python3 scripts/release/test-android-resources.py
      - name: Checksums
        run: python3 scripts/release/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yun-android-arm64-${{ inputs.android_signing }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
