name: Private release candidates
# Artifacts only: no tags, GitHub Releases, registry pushes, or public distribution.
on:
  workflow_dispatch:
    inputs:
      android_signing:
        description: Android APK signing (release requires protected operator secrets)
        type: choice
        options:
          - debug-signed
          - release-signed
        default: debug-signed
        required: true
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clients:
    uses: ./.github/workflows/native-builds.yml
    with:
      android_signing: ${{ inputs.android_signing }}
    # Prefer protected release-signing environment secrets on the called job.
    # Explicit mapping also supports repository/org secrets; do not inherit all.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: |
          cargo build --manifest-path server/Cargo.toml --release --locked
          mkdir -p dist/server
          cp server/target/release/yun-server server/README.md server/Cargo.lock dist/server/
          cp docs/OPERATIONS.md dist/server/
          cargo metadata --manifest-path server/Cargo.toml --locked --format-version 1 > dist/server/dependencies.json
          tar -czf dist/yun-server-linux-x64.tar.gz -C dist/server .
          rm -rf dist/server
          python scripts/release/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: yun-server-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
