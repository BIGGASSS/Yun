name: Release candidates
# Artifacts only: no tags, GitHub Releases, or registry pushes.
# Workflow artifacts are public in this public repository; they are not private.
on:
  workflow_dispatch:
    inputs:
      android_signing:
        description: Android APK signing (release requires main and release-signing environment approval)
        type: choice
        options:
          - debug-signed
          - release-signed
        default: debug-signed
        required: true
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clients:
    uses: ./.github/workflows/native-builds.yml
    with:
      android_signing: ${{ inputs.android_signing }}
    # Explicit name bindings for reusable-workflow environment-secret resolution.
    # Keep values ONLY in release-signing; never use secrets: inherit here.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ inputs.android_signing == 'release-signed' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ inputs.android_signing == 'release-signed' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ inputs.android_signing == 'release-signed' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ inputs.android_signing == 'release-signed' && secrets.ANDROID_KEY_PASSWORD || '' }}
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - run: |
          cargo build --manifest-path server/Cargo.toml --release --locked
          mkdir -p dist/server
          cp server/target/release/yun-server server/README.md server/Cargo.lock dist/server/
          cp docs/OPERATIONS.md dist/server/
          cargo metadata --manifest-path server/Cargo.toml --locked --format-version 1 > dist/server/dependencies.json
          tar -czf dist/yun-server-linux-x64.tar.gz -C dist/server .
          rm -rf dist/server
          python scripts/release/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yun-server-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
